name: LinkedIn Auto Poster

on:
  schedule:
    - cron: '0 10 * * 3,6' # Runs Tuesdays and Thursdays at 10:00 AM UTC
  workflow_dispatch: # Allows manual testing

permissions:
  contents: write 

jobs:
  post-and-save:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      
      - name: Run Script
        env:
          LINKEDIN_TOKEN: ${{ secrets.LINKEDIN_TOKEN }}
          LINKEDIN_URN: ${{ secrets.LINKEDIN_URN }}
          TWILIO_SID: ${{ secrets.TWILIO_SID }}
          TWILIO_TOKEN: ${{ secrets.TWILIO_TOKEN }}
          TWILIO_FROM: ${{ secrets.TWILIO_FROM }}
          MY_PHONE: ${{ secrets.MY_PHONE }}
        run: python main.py

      - name: Save Queue Progress
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add queue.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Updated queue" && git pull --rebase origin main && git push)
